<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="AnimeVault anime library"
  >

  <link
    rel="icon"
    type="image/png"
    href="./assets/favicon.png?v=2"
  >

  <title>AnimeVault</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <a
      class="logo"
      href="index.html"
      aria-label="AnimeVault Home"
    >

      <img
        src="./assets/logo.png"
        alt="AnimeVault Logo"
      >

      <span>AnimeVault</span>

    </a>

    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
    </nav>

  </header>


  <!-- MAIN -->
  <main class="container">

    <section class="hero">

      <span class="eyebrow">
        ANIME LIBRARY
      </span>

      <h1>
        Your anime.<br>
        One clean vault.
      </h1>

      <p>
        Browse your anime collection by name,
        season and episode.
      </p>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search anime..."
        autocomplete="off"
        aria-label="Search anime"
      >

    </section>


    <section>

      <div
        id="grid"
        class="grid"
      ></div>

      <p
        id="status"
        class="muted"
      ></p>

    </section>

  </main>


  <!-- JAVASCRIPT -->
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>

</body>

</html>
